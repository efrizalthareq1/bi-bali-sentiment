# fly.toml — alternatif Railway/Render untuk API FastAPI
# Deploy: cd backend && fly launch --copy-config --yes
# Lalu: fly secrets set CORS_ORIGINS=https://bi-bali-sentiment.vercel.app

app = "bi-aceh-sentiment-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
